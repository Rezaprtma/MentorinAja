version: "3"

vars:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  FRONTEND_ENV_EXAMPLE: frontend/.env.example
  BACKEND_ENV_EXAMPLE: backend/.env.example

tasks:
  # ══════════════════════════════════════
  # Entry points
  # ══════════════════════════════════════

  default:
    desc: List available repository commands
    shell: powershell
    cmds:
      - task --list

  help:
    desc: Show grouped repository commands and task categories
    shell: powershell
    cmds:
      - |
        Write-Host "Development"
        Write-Host "  task dev"
        Write-Host "  task frontend"
        Write-Host "  task backend"
        Write-Host ""
        Write-Host "Setup"
        Write-Host "  task setup"
        Write-Host "  task frontend:setup"
        Write-Host "  task backend:setup"
        Write-Host ""
        Write-Host "Quality"
        Write-Host "  task analyze"
        Write-Host "  task format"
        Write-Host "  task test"
        Write-Host "  task doctor"
        Write-Host "  task status"
        Write-Host ""
        Write-Host "Build"
        Write-Host "  task build"
        Write-Host "  task build:android"
        Write-Host "  task build:windows"
        Write-Host ""
        Write-Host "Maintenance"
        Write-Host "  task clean"
        Write-Host "  task clean:frontend"
        Write-Host "  task clean:backend"
        Write-Host "  task clean:repository"
        Write-Host "  task update"

  setup:
    desc: Install the full repository toolchain for frontend and backend contributors
    shell: powershell
    deps:
      - frontend:setup
      - backend:setup
    cmds:
      - |
        Write-Host "══════════════════════════════════════"
        Write-Host "MentorinAja Setup Complete"
        Write-Host "══════════════════════════════════════"
        Write-Host "Frontend ........ PASS"
        Write-Host "Backend ......... PASS"
        Write-Host "Repository ...... READY"
        Write-Host "══════════════════════════════════════"

  doctor:
    desc: Run frontend and backend doctor checks with a combined summary
    shell: powershell
    cmds:
      - |
        Write-Host "══════════════════════════════════════"
        Write-Host "MentorinAja Doctor"
        Write-Host "══════════════════════════════════════"
        task -s frontend:doctor
        $frontendStatus = $LASTEXITCODE
        task -s backend:doctor
        $backendStatus = $LASTEXITCODE
        if ($frontendStatus -eq 0 -and $backendStatus -eq 0) { $repoStatus = 'READY' } else { $repoStatus = 'NOT READY' }
        $frontendLabel = if ($frontendStatus -eq 0) { 'PASS' } else { 'FAIL' }
        $backendLabel = if ($backendStatus -eq 0) { 'PASS' } else { 'FAIL' }
        Write-Host "══════════════════════════════════════"
        Write-Host ("{0,-16} {1}" -f "Frontend .......", $frontendLabel)
        Write-Host ("{0,-16} {1}" -f "Backend ........", $backendLabel)
        Write-Host ("{0,-16} {1}" -f "Repository .....", $repoStatus)
        Write-Host "══════════════════════════════════════"
        if ($repoStatus -eq 'READY') {
          Write-Host "Repository Ready"
          exit 0
        } else {
          Write-Host "Repository Not Ready"
          exit 1
        }

  status:
    desc: Show repository environment and toolchain versions
    shell: powershell
    cmds:
      - |
        function Get-VersionSafe {
          param([scriptblock]$Command)
          try { return ((& $Command) | Select-Object -First 1).ToString().Trim() }
          catch { return 'Not installed' }
        }

        $flutterVersion = Get-VersionSafe { flutter --version 2>&1 }
        $dartVersion = Get-VersionSafe { dart --version 2>&1 }
        $pythonVersion = Get-VersionSafe { python --version 2>&1 }
        $taskVersion = Get-VersionSafe { task --version 2>&1 }

        try { $branch = (git rev-parse --abbrev-ref HEAD 2>$null).Trim() } catch { $branch = 'Unknown' }
        if ([string]::IsNullOrWhiteSpace($branch)) { $branch = 'Unknown' }

        try {
          $flutterDevice = ((flutter devices --machine 2>$null | Out-String).Split("`n")[0]).Trim()
          if ([string]::IsNullOrWhiteSpace($flutterDevice)) { $flutterDevice = 'No device detected' }
        } catch { $flutterDevice = 'No device detected' }

        $os = (Get-CimInstance Win32_OperatingSystem).Caption

        $supabase = task -s check-supabase 2>&1 | Select-Object -Last 1

        task -s doctor | Out-Null
        $repoReady = if ($LASTEXITCODE -eq 0) { 'Repository Ready' } else { 'Repository Not Ready' }

        $venvStatus = if (Test-Path 'backend/.venv') { 'Present' } else { 'Missing' }

        Write-Host "Flutter Version: $flutterVersion"
        Write-Host "Dart Version: $dartVersion"
        Write-Host "Python Version: $pythonVersion"
        Write-Host "Backend Virtual Environment: $venvStatus"
        Write-Host "Current Git Branch: $branch"
        Write-Host "Flutter Device: $flutterDevice"
        Write-Host "Operating System: $os"
        Write-Host "Task Version: $taskVersion"
        Write-Host "Supabase CLI (Optional): $supabase"
        Write-Host "Repository Status: $repoReady"

        if ($repoReady -ne 'Repository Ready') { exit 1 }

  update:
    desc: Upgrade frontend and backend dependencies, then verify repository health
    shell: powershell
    deps:
      - frontend:update
      - backend:update
      - doctor

  dev:
    desc: Start frontend and backend together
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Write-Host "Starting Frontend..."
        Start-Process -FilePath "flutter" -ArgumentList "run" -WorkingDirectory "frontend" -WindowStyle Normal | Out-Null
        Write-Host "Starting Backend..."
        Start-Process -FilePath ".\backend\.venv\Scripts\python.exe" -ArgumentList "-m", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000" -WorkingDirectory "backend" -WindowStyle Normal | Out-Null
        Write-Host "Frontend URL: http://localhost:54321 (device/emulator dependent)"
        Write-Host "Backend URL: http://localhost:8000"
        Write-Host "If a process fails, inspect the PowerShell window for the error."

  # ══════════════════════════════════════
  # Clean
  # ══════════════════════════════════════

  clean:
    desc: Remove generated caches and temporary artifacts
    shell: powershell
    deps:
      - clean:frontend
      - clean:backend
      - clean:repository

  clean:frontend:
    desc: Remove frontend generated artifacts and caches
    shell: powershell
    cmds:
      - |
        if (Test-Path "frontend/build") { Remove-Item -Recurse -Force "frontend/build" }
        if (Test-Path "frontend/.dart_tool") { Remove-Item -Recurse -Force "frontend/.dart_tool" }
        if (Test-Path "frontend/.packages") { Remove-Item -Force "frontend/.packages" }
        if (Test-Path "frontend/.flutter-plugins-dependencies") { Remove-Item -Force "frontend/.flutter-plugins-dependencies" }
        Write-Host "Frontend clean completed."

  clean:backend:
    desc: Remove backend generated artifacts and caches
    shell: powershell
    cmds:
      - |
        if (Test-Path "backend/__pycache__") { Remove-Item -Recurse -Force "backend/__pycache__" }
        if (Test-Path "backend/.pytest_cache") { Remove-Item -Recurse -Force "backend/.pytest_cache" }
        if (Test-Path "backend/coverage") { Remove-Item -Recurse -Force "backend/coverage" }
        if (Test-Path "backend/.mypy_cache") { Remove-Item -Recurse -Force "backend/.mypy_cache" }
        Write-Host "Backend clean completed."

  clean:repository:
    desc: Remove repository temporary files and generated logs
    shell: powershell
    cmds:
      - |
        if (Test-Path "tmp") { Remove-Item -Recurse -Force "tmp" }
        Get-ChildItem -Path . -Filter "*.log" -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
        Write-Host "Repository clean completed."

  # ══════════════════════════════════════
  # Quality
  # ══════════════════════════════════════

  format:
    desc: Format frontend and backend source files
    shell: powershell
    deps:
      - frontend:format
      - backend:format

  analyze:
    desc: Run frontend and backend analysis
    shell: powershell
    deps:
      - frontend:analyze
      - backend:analyze

  test:
    desc: Run frontend and backend test suites
    shell: powershell
    deps:
      - frontend:test
      - backend:test

  # ══════════════════════════════════════
  # Build
  # ══════════════════════════════════════

  build:
    desc: Build all applicable repository artifacts
    shell: powershell
    deps:
      - build:android
      - build:windows
      - backend:build

  release:
    desc: Prepare release artifacts without publishing
    shell: powershell
    deps:
      - build:android
      - build:windows
      - backend:build

  build:android:
    desc: Build Android APK release artifact
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter build apk --release

  build:windows:
    desc: Build Windows release artifact
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter build windows --release

  # ══════════════════════════════════════
  # Frontend
  # ══════════════════════════════════════

  frontend:
    desc: Run the Flutter frontend application
    shell: powershell
    cmds:
      - |
        $devices = flutter devices --machine | Out-String
        if ($devices -match '"id"') {
          Set-Location frontend
          flutter run
        } else {
          Write-Host "FAIL: No connected device or emulator detected. Start one in Android Studio or use a connected device before running task frontend."
          exit 1
        }

  frontend:setup:
    desc: Install frontend dependencies and verify frontend toolchain requirements
    shell: powershell
    deps:
      - verify-flutter
      - verify-dart
      - verify-android-sdk
      - verify-java
      - install-frontend-deps
      - frontend:analyze
      - verify-flutter-doctor
      - frontend:doctor
      - validate-frontend-env

  frontend:update:
    desc: Upgrade frontend dependencies
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter pub upgrade

  frontend:doctor:
    desc: Run frontend doctor checks and print a concise summary
    shell: powershell
    cmds:
      - |
        Write-Host "══════════════════════════════════════"
        Write-Host "MentorinAja Frontend Doctor"
        Write-Host "══════════════════════════════════════"

        task -s verify-flutter | Out-Null; $flutterStatus = $LASTEXITCODE
        task -s verify-dart | Out-Null; $dartStatus = $LASTEXITCODE
        task -s verify-android-sdk | Out-Null; $androidStatus = $LASTEXITCODE
        task -s verify-java | Out-Null; $javaStatus = $LASTEXITCODE
        task -s verify-flutter-doctor | Out-Null; $flutterDoctorStatus = $LASTEXITCODE
        task -s validate-frontend-env | Out-Null; $envStatus = $LASTEXITCODE

        Write-Host ("{0,-22} {1}" -f "Flutter.............", $(if ($flutterStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Dart................", $(if ($dartStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Android SDK.........", $(if ($androidStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Java................", $(if ($javaStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Flutter Doctor......", $(if ($flutterDoctorStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Environment.........", $(if ($envStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host "══════════════════════════════════════"

        if ($flutterStatus -ne 0 -or $dartStatus -ne 0 -or $androidStatus -ne 0 -or $javaStatus -ne 0 -or $flutterDoctorStatus -ne 0 -or $envStatus -ne 0) {
          Write-Host "Frontend Not Ready"
          exit 1
        }
        Write-Host "Frontend Ready"
        exit 0

  frontend:test:
    desc: Run Flutter frontend tests
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter test

  frontend:format:
    desc: Format Flutter frontend source files
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        dart format lib test integration_test

  frontend:analyze:
    desc: Analyze Flutter frontend source files
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter analyze

  frontend:build:
    desc: Build Flutter frontend artifacts
    shell: powershell
    deps:
      - build:android
      - build:windows

  # ══════════════════════════════════════
  # Backend
  # ══════════════════════════════════════

  backend:
    desc: Run the Python backend application
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  backend:setup:
    desc: Install backend dependencies and verify Python workflow tools
    shell: powershell
    deps:
      - verify-python
      - verify-pip
      - ensure-venv
      - install-backend-deps
      - backend:analyze
      - validate-backend-env
      - backend:doctor

  backend:update:
    desc: Upgrade backend dependencies
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip
        python -m pip install --upgrade -r requirements.txt

  backend:doctor:
    desc: Run backend doctor checks and print a concise summary
    shell: powershell
    cmds:
      - |
        Write-Host "══════════════════════════════════════"
        Write-Host "MentorinAja Backend Doctor"
        Write-Host "══════════════════════════════════════"

        task -s verify-python | Out-Null; $pythonStatus = $LASTEXITCODE
        task -s verify-pip | Out-Null; $pipStatus = $LASTEXITCODE
        task -s ensure-venv | Out-Null; $venvStatus = $LASTEXITCODE
        task -s validate-backend-env | Out-Null; $envStatus = $LASTEXITCODE
        $supabase = task -s check-supabase 2>&1 | Select-Object -Last 1

        Write-Host ("{0,-22} {1}" -f "Python..............", $(if ($pythonStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "pip.................", $(if ($pipStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Virtualenv..........", $(if ($venvStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Environment.........", $(if ($envStatus -eq 0) { 'PASS' } else { 'FAIL' }))
        Write-Host ("{0,-22} {1}" -f "Supabase CLI........", $supabase)
        Write-Host "══════════════════════════════════════"

        if ($pythonStatus -ne 0 -or $pipStatus -ne 0 -or $venvStatus -ne 0 -or $envStatus -ne 0) {
          Write-Host "Backend Not Ready"
          exit 1
        }
        Write-Host "Backend Ready"
        exit 0

  backend:test:
    desc: Run Python backend tests
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m pytest

  backend:format:
    desc: Format Python backend source files
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m black app tests

  backend:analyze:
    desc: Analyze Python backend source files
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m compileall app

  backend:build:
    desc: Build or package backend artifacts when available
    shell: powershell
    cmds:
      - |
        Write-Host "PASS: Backend build is not configured in this repository. Use backend packaging workflows when required."

  # ══════════════════════════════════════
  # Verification helpers (frontend)
  # ══════════════════════════════════════

  verify-git:
    desc: Verify Git installation
    shell: powershell
    silent: true
    cmds:
      - |
        if (Get-Command git -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Git"
        } else {
          Write-Host "FAIL: Git"
          exit 1
        }

  verify-flutter:
    desc: Verify Flutter SDK installation
    shell: powershell
    silent: true
    cmds:
      - |
        if (Get-Command flutter -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Flutter SDK"
        } else {
          Write-Host "FAIL: Flutter SDK"
          exit 1
        }

  verify-dart:
    desc: Verify Dart SDK installation
    shell: powershell
    silent: true
    cmds:
      - |
        if (Get-Command dart -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Dart SDK"
        } else {
          Write-Host "FAIL: Dart SDK"
          exit 1
        }

  verify-android-sdk:
    desc: Verify Android SDK exposure
    shell: powershell
    silent: true
    cmds:
      - |
        $flutter = Get-Command flutter -ErrorAction SilentlyContinue
        if (-not $flutter) {
          Write-Host "FAIL: Android SDK (flutter unavailable)"
          exit 1
        }

        $doctor = (flutter doctor -v 2>&1) -join "`n"
        if ($doctor -match "No issues found!") {
          Write-Host "PASS: Android SDK"
          exit 0
        }
        if ($doctor -match "^\[√\].*Android toolchain") {
          Write-Host "PASS: Android SDK"
          exit 0
        }

        $sdkPath = $null
        $config = (flutter config --list 2>&1) -join "`n"
        if ($config -match "android-sdk:\s*(.+)") {
          $sdkPath = $Matches[1].Trim()
        } elseif ($env:ANDROID_SDK_ROOT) {
          $sdkPath = $env:ANDROID_SDK_ROOT
        } elseif ($env:ANDROID_HOME) {
          $sdkPath = $env:ANDROID_HOME
        }

        if ($sdkPath) {
          $required = @("platform-tools", "build-tools", "platforms", "cmdline-tools")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $sdkPath $_) -PathType Container) }
          if (-not $missing) {
            Write-Host "PASS: Android SDK"
            exit 0
          }
        }

        Write-Host "FAIL: Android SDK"
        exit 1

  verify-java:
    desc: Verify Java installation
    shell: powershell
    silent: true
    cmds:
      - |
        $flutter = Get-Command flutter -ErrorAction SilentlyContinue
        if (-not $flutter) {
          Write-Host "FAIL: Java (flutter unavailable)"
          exit 1
        }

        $doctor = (flutter doctor -v 2>&1) -join "`n"
        if ($doctor -match "No issues found!") {
          Write-Host "PASS: Java"
          exit 0
        }
        if ($doctor -match "^\[√\].*Android toolchain") {
          Write-Host "PASS: Java"
          exit 0
        }
        if (Get-Command java -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Java"
          exit 0
        }
        if ($doctor -match "Java binary at:\s*(.+)") {
          $javaPath = $Matches[1].Trim()
          if (Test-Path $javaPath) {
            Write-Host "PASS: Java"
            exit 0
          }
        }
        if (Test-Path "$env:ProgramFiles\Android\Android Studio\jbr\bin\java.exe") {
          Write-Host "PASS: Java"
          exit 0
        }
        if (Test-Path "$env:LOCALAPPDATA\Programs\Android\Android Studio\jbr\bin\java.exe") {
          Write-Host "PASS: Java"
          exit 0
        }

        Write-Host "FAIL: Java"
        exit 1

  verify-flutter-doctor:
    desc: Verify Flutter doctor reports a clean frontend environment
    shell: powershell
    silent: true
    cmds:
      - |
        $flutter = Get-Command flutter -ErrorAction SilentlyContinue
        if (-not $flutter) {
          Write-Host "FAIL: Flutter Doctor (flutter unavailable)"
          exit 1
        }

        $doctor = (flutter doctor -v 2>&1) -join "`n"
        if ($doctor -match "No issues found!") {
          Write-Host "PASS: Flutter Doctor"
          exit 0
        }

        Write-Host "FAIL: Flutter Doctor"
        exit 1

  install-frontend-deps:
    desc: Install Flutter frontend dependencies
    shell: powershell
    cmds:
      - |
        Set-Location frontend
        flutter pub get

  validate-frontend-env:
    desc: Validate frontend environment example exists
    shell: powershell
    silent: true
    cmds:
      - |
        if (Test-Path "frontend/.env.example") {
          Write-Host "PASS: frontend/.env.example"
        } else {
          Write-Host "FAIL: frontend/.env.example missing"
          exit 1
        }

  # ══════════════════════════════════════
  # Verification helpers (backend)
  # ══════════════════════════════════════

  verify-python:
    desc: Verify Python installation
    shell: powershell
    silent: true
    cmds:
      - |
        if (Get-Command python -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Python"
        } else {
          Write-Host "FAIL: Python"
          exit 1
        }

  verify-pip:
    desc: Verify pip installation
    shell: powershell
    silent: true
    cmds:
      - |
        python -m pip --version | Out-Null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "PASS: pip"
        } else {
          Write-Host "FAIL: pip"
          exit 1
        }

  ensure-venv:
    desc: Ensure the backend virtual environment exists
    shell: powershell
    status:
      - Test-Path backend/.venv
    cmds:
      - |
        if (-not (Test-Path "backend/.venv")) {
          python -m venv backend/.venv
        }

  install-backend-deps:
    desc: Install backend dependencies into the configured virtual environment
    shell: powershell
    deps:
      - ensure-venv
    cmds:
      - |
        Set-Location backend
        .\.venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

  validate-backend-env:
    desc: Validate backend environment example exists
    shell: powershell
    silent: true
    cmds:
      - |
        if (Test-Path "backend/.env.example") {
          Write-Host "PASS: backend/.env.example"
        } else {
          Write-Host "FAIL: backend/.env.example missing"
          exit 1
        }

  check-supabase:
    desc: Check for optional Supabase CLI installation
    shell: powershell
    silent: true
    cmds:
      - |
        if (Get-Command supabase -ErrorAction SilentlyContinue) {
          Write-Host "PASS: Supabase CLI"
        } else {
          Write-Host "WARNING: Supabase CLI is not installed. Install it only if backend Supabase workflows are required."
        }
